<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JatinStudies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: soft pastel aurora background, frosted glass surfaces, bold gradient subject tiles.
   Layout: home = 5 tiles (2 wide + 3 narrow); subject = gradient banner, two folders, glass cards. */
:root{
  --bg:#F6F3FF; --ink:#1B1740; --muted:#6A6590; --surface:#FFFFFF; --line:rgba(90,70,190,.14);
  --glass:rgba(255,255,255,.66); --glass-edge:rgba(255,255,255,.95);
  --brand-a:#7C5CFF; --brand-b:#FF5FA2;
  --blob1:rgba(255,170,214,.65); --blob2:rgba(168,196,255,.7); --blob3:rgba(255,214,170,.6); --blob4:rgba(160,236,214,.6);
  --shadow:0 12px 32px rgba(90,70,190,.12);
  --display:'Outfit',system-ui,sans-serif; --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0B0A1E; --ink:#F2F0FF; --muted:#A9A5D0; --surface:#171434; --line:rgba(170,150,255,.18);
    --glass:rgba(32,27,70,.62); --glass-edge:rgba(255,255,255,.1);
    --brand-a:#9A82FF; --brand-b:#FF7BB4;
    --blob1:rgba(170,50,130,.5); --blob2:rgba(50,80,200,.5); --blob3:rgba(150,80,40,.4); --blob4:rgba(20,130,125,.45);
    --shadow:0 12px 32px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;min-height:100vh;display:flex;flex-direction:column;position:relative;isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(620px 420px at 6% 0%,var(--blob1),transparent 70%),
    radial-gradient(560px 520px at 100% 8%,var(--blob2),transparent 70%),
    radial-gradient(640px 520px at 86% 100%,var(--blob3),transparent 70%),
    radial-gradient(520px 420px at 0% 92%,var(--blob4),transparent 70%)}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand-a);outline-offset:3px}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--glass-edge);box-shadow:var(--shadow)}

.top .wrap{display:flex;align-items:center;padding-block:18px 6px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:600;font-size:1.05rem;padding:6px 16px 6px 6px;border-radius:999px}
.mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand-a),var(--brand-b));color:#fff}
.mark svg{width:18px;height:18px}

main{flex:1}
.page{padding-block:26px 64px}

.hero{max-width:640px}
.hero h1{font-size:clamp(2.4rem,8vw,4rem);font-weight:700;letter-spacing:-.03em;color:var(--brand-a);
  background:linear-gradient(100deg,var(--brand-a),var(--brand-b));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{margin:12px 0 0;color:var(--muted);font-size:1.1rem}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:.88rem;font-weight:500}
.pill svg{width:16px;height:16px;color:var(--brand-a)}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px;margin-top:30px}
.tile,.banner{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 16px 36px color-mix(in srgb,var(--c1) 38%,transparent)}
.tile::after,.banner::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(280px 200px at 0% 0%,rgba(255,255,255,.3),transparent 70%)}
.tile{grid-column:span 2;min-height:210px;border-radius:30px;padding:22px;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;gap:18px;
  transition:transform .2s,box-shadow .2s;animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.tile:nth-child(-n+2){grid-column:span 3}
.tile:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 22px 44px color-mix(in srgb,var(--c1) 48%,transparent)}
.tile>*:not(.wm),.banner>*:not(.wm){position:relative;z-index:1}
.ibadge{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);font-family:var(--display);font-weight:700;font-size:1.5rem}
.ibadge svg{width:28px;height:28px}
.wm{position:absolute;right:-18px;bottom:-26px;width:170px;height:170px;display:grid;place-items:center;opacity:.17;font-family:var(--display);font-weight:700;font-size:8rem;line-height:1;pointer-events:none}
.wm svg{width:100%;height:100%;stroke-width:1.4}
.tile h3{font-size:1.7rem;font-weight:600;letter-spacing:-.01em}
.counts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cpill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);font-size:.85rem;font-weight:500}
.cpill svg{width:14px;height:14px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:500;padding:8px 16px;border-radius:999px;margin-bottom:18px;font-size:.92rem}
.banner{border-radius:34px;padding:26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-height:150px}
.banner .ibadge{width:72px;height:72px;border-radius:24px;font-size:2rem}
.banner .ibadge svg{width:36px;height:36px}
.banner h1{font-size:clamp(2rem,6vw,3rem);font-weight:700;letter-spacing:-.02em}
.folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}
.folder{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:24px;text-decoration:none;min-width:0;transition:transform .15s}
.folder:hover{transform:translateY(-2px)}
.folder .fi{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.folder .fi svg{width:24px;height:24px}
.folder b{font-family:var(--display);font-size:1.1rem;font-weight:600;display:block}
.folder small{color:var(--muted)}
.folder[aria-current=page]{background:linear-gradient(135deg,var(--c1),var(--c2));border-color:transparent;color:#fff;box-shadow:0 14px 30px color-mix(in srgb,var(--c1) 38%,transparent)}
.folder[aria-current=page] small{color:rgba(255,255,255,.85)}
.folder[aria-current=page] .fi{background:rgba(255,255,255,.22)}
.sechead{margin:30px 0 16px}
.sechead h2{font-size:1.35rem;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{display:flex;flex-direction:column;min-width:0;border-radius:26px;padding:8px;transition:transform .2s;animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*50ms)}
.card:hover{transform:translateY(-4px)}
.open{display:block;width:100%;padding:0;border:0;background:none;text-align:left}
.thumb{position:relative;display:grid;place-items:center;aspect-ratio:16/10;max-width:100%;border-radius:19px;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 30%,var(--surface)),color-mix(in srgb,var(--c2) 30%,var(--surface)))}
.thumb .ph{width:44px;height:44px;color:color-mix(in srgb,var(--c1) 80%,var(--ink));opacity:.6}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.88);color:var(--c1);box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .2s}
.play svg{width:18px;height:18px;margin-left:3px}
.card:hover .play{transform:scale(1.1)}
.badge{position:absolute;left:10px;top:10px;padding:3px 10px;border-radius:999px;background:rgba(20,16,50,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:.7rem;font-weight:600;letter-spacing:.08em}
.ctitle{display:block;padding:12px 10px 2px;font-family:var(--display);font-weight:500;font-size:1.02rem;overflow-wrap:anywhere}
.cmeta{padding:0 10px 10px;color:var(--muted);font-size:.82rem}
.empty{border:2px dashed var(--line);border-radius:28px;padding:40px 20px;text-align:center;color:var(--muted);background:var(--glass)}
.empty .ei{width:56px;height:56px;margin:0 auto 12px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.empty .ei svg{width:28px;height:28px}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:1.1rem;margin-bottom:4px}

dialog{border:1px solid var(--glass-edge);border-radius:26px;padding:0;overflow:hidden;background:var(--surface);color:var(--ink);width:min(980px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 30px 80px rgba(10,6,40,.5)}
dialog::backdrop{background:rgba(12,8,40,.62);backdrop-filter:blur(6px)}
.dhead{display:flex;align-items:center;gap:12px;padding:14px 18px}
.dhead h2{flex:1;min-width:0;font-size:1.05rem;font-weight:600;overflow-wrap:anywhere}
.dhead a{font-size:.85rem;color:var(--muted);white-space:nowrap}
.x{border:0;background:var(--bg);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.frame{background:#000}
.frame.video{aspect-ratio:16/9}
.frame.pdf{height:min(78vh,860px);background:var(--bg)}
.frame iframe{width:100%;height:100%;border:0;display:block}
.dnote{margin:0;padding:12px 18px;font-size:.82rem;color:var(--muted)}

.lock{max-width:440px;margin:6vh auto 0;border-radius:32px;padding:32px 26px;text-align:center;display:grid;gap:12px;justify-items:center}
.lockicon{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand-a),var(--brand-b));color:#fff}
.lockicon svg{width:32px;height:32px}
.lock h1{font-size:1.8rem}
.lock p{margin:0;color:var(--muted)}
.lock form{display:grid;gap:12px;width:100%;margin-top:6px}
.lock input{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:center;font-size:1.1rem;letter-spacing:.08em}
.lockbtn{border:0;border-radius:999px;padding:13px 20px;font-weight:600;font-size:1rem;color:#fff;background:linear-gradient(135deg,var(--brand-a),var(--brand-b))}
.lock .lockerr{color:#E0426A;min-height:1.4em;font-size:.92rem}

.fsbtn{display:inline-flex;align-items:center;gap:8px;flex:none;border:0;border-radius:999px;padding:9px 16px;font-weight:600;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--brand-a),var(--brand-b))}
.fsbtn svg{width:18px;height:18px}
.dnote a{color:var(--brand-a);font-weight:600}
.frame:fullscreen,.frame:-webkit-full-screen{aspect-ratio:auto;width:100%;height:100%}
dialog.fs{width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;border:0;border-radius:0;background:#000}
dialog.fs[open]{display:flex;flex-direction:column}
dialog.fs .dhead{background:#000;color:#fff;padding:max(8px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
dialog.fs .dhead h2{font-size:.9rem}
dialog.fs .x{background:rgba(255,255,255,.18);color:#fff}
dialog.fs .frame{flex:1;min-height:0;aspect-ratio:auto;height:auto}
dialog.fs .dnote{display:none}
dialog{max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px)}
@media (max-width:600px){
  dialog:not(.fs){width:100vw;max-width:100vw;border-radius:0}
  .fsbtn{padding:9px 12px}
}

@media (max-width:760px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .tile,.tile:nth-child(-n+2){grid-column:span 1;min-height:190px}
  .tile:last-child{grid-column:span 2}
}
@media (max-width:480px){
  .tiles{grid-template-columns:minmax(0,1fr)}
  .tile:last-child{grid-column:span 1}
  .folders{gap:10px}
  .folder{padding:12px;gap:10px}
  .folder .fi{width:40px;height:40px}
  .banner{padding:20px;border-radius:28px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand glass" href="#">
    <span class="mark"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7c4-2 8-2 12 1v18c-4-3-8-3-12-1z"/><path d="M28 7c-4-2-8-2-12 1v18c4-3 8-3 12-1z"/></svg></span>
    <span id="brand-name">JatinStudies</span>
  </a>
</div></header>
<main><div class="wrap page" id="app"></div></main>

<dialog id="player" aria-labelledby="player-title">
  <div class="dhead">
    <h2 id="player-title"></h2>
    <button class="fsbtn" type="button" id="player-fs" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Full screen</span></button>
    <button class="x" type="button" id="player-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="frame video" id="player-frame"></div>
  <p class="dnote">Not playing? <a id="player-drive" href="#" target="_blank" rel="noopener">Open it in Drive</a>. If Drive says you need access, tell the owner.</p>
</dialog>

<script src="content.js"></script>
<script>
(function(){
var SUBJECTS=[
  {id:'hindi',name:'Hindi',icon:'pencil',c1:'#F0593A',c2:'#DB2777'},
  {id:'english',name:'English',icon:'Aa',c1:'#3B6FE0',c2:'#6D5BE0'},
  {id:'maths',name:'Maths',icon:'π',c1:'#8B5CF6',c2:'#C026D3'},
  {id:'science',name:'Science',icon:'flask',c1:'#0D9488',c2:'#0E7490'},
  {id:'social',name:'Social',icon:'globe',c1:'#D97706',c2:'#C2410C'}
];
var S='fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
var ICON={
  folder:'<svg viewBox="0 0 32 32" '+S+'><path d="M3 9a2 2 0 0 1 2-2h7l3 3h12a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  play:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.5v13l11-6.5z"/></svg>',
  video:'<svg viewBox="0 0 24 24" '+S+'><rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>',
  pdf:'<svg viewBox="0 0 24 24" '+S+'><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" '+S+'><path d="M4 20l1.5-5L16 4.5a2.1 2.1 0 0 1 3 3L8.5 18z"/><path d="M13.5 7l3 3"/></svg>',
  flask:'<svg viewBox="0 0 24 24" '+S+'><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 15h9"/></svg>',
  globe:'<svg viewBox="0 0 24 24" '+S+'><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
  lock:'<svg viewBox="0 0 24 24" '+S+'><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function iconHtml(s){return ICON[s.icon]||esc(s.icon)}
function cv(s){return '--c1:'+s.c1+';--c2:'+s.c2}

var raw=window.STUDY_DATA||{};
var state={title:raw.title||'JatinStudies',api:String(raw.api||'').trim(),items:Array.isArray(raw.items)?raw.items:[]};

var app=document.getElementById('app');
var player=document.getElementById('player');
var playerFrame=document.getElementById('player-frame');

function count(sub,kind){return state.items.filter(function(i){return i.subject===sub&&i.kind===kind}).length}
function plural(n,w){return n+' '+w+(n===1?'':'s')}
function parseRoute(){
  var h=location.hash.replace(/^#\/?/,'').split('/');
  var sub=SUBJECTS.filter(function(x){return x.id===h[0]})[0]||null;
  return {sub:sub,kind:h[1]==='pdfs'?'pdf':'video'};
}
function previewUrl(id){return 'https://drive.google.com/file/d/'+id+'/preview'}
function openUrl(id){return 'https://drive.google.com/file/d/'+id+'/view'}

function renderHome(){
  var tv=0,tp=0;
  var tiles=SUBJECTS.map(function(s,i){
    var v=count(s.id,'video'),p=count(s.id,'pdf');tv+=v;tp+=p;
    return '<a class="tile" href="#'+s.id+'/videos" style="'+cv(s)+';--i:'+i+'">'+
      '<span class="wm" aria-hidden="true">'+iconHtml(s)+'</span>'+
      '<span class="ibadge" aria-hidden="true">'+iconHtml(s)+'</span>'+
      '<span><h3>'+s.name+'</h3>'+
      '<span class="counts"><span class="cpill">'+ICON.video+plural(v,'video')+'</span><span class="cpill">'+ICON.pdf+plural(p,'PDF')+'</span></span></span></a>';
  }).join('');
  app.innerHTML='<section class="hero"><h1>'+esc(state.title)+'</h1><p>Pick a subject. Watch the lessons, open the notes, keep going.</p>'+
    '<div class="stats"><span class="pill glass">'+ICON.video+plural(tv,'video')+'</span><span class="pill glass">'+ICON.pdf+plural(tp,'PDF')+'</span></div></section>'+
    '<div class="tiles">'+tiles+'</div>';
}

function card(it,i){
  var date='';
  try{date=new Date(it.added).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}catch(e){}
  return '<article class="card glass" style="--i:'+Math.min(i,10)+'">'+
    '<button class="open" type="button" data-open="'+esc(it.id)+'" aria-label="Open '+esc(it.title)+'">'+
      '<span class="thumb"><span class="ph">'+(it.kind==='video'?ICON.video:ICON.pdf)+'</span>'+
      '<img loading="lazy" alt="" src="https://drive.google.com/thumbnail?id='+encodeURIComponent(it.fid)+'&sz=w640">'+
      '<span class="badge">'+(it.kind==='video'?'VIDEO':'PDF')+'</span>'+
      (it.kind==='video'?'<span class="play">'+ICON.play+'</span>':'')+'</span>'+
      '<span class="ctitle">'+esc(it.title)+'</span></button>'+
    '<div class="cmeta">'+esc(date)+'</div></article>';
}

function renderSubject(s,kind){
  var items=state.items.filter(function(i){return i.subject===s.id&&i.kind===kind}).sort(function(a,b){return b.added-a.added});
  var v=count(s.id,'video'),p=count(s.id,'pdf');
  var label=kind==='video'?'Videos':'PDFs';
  var body=items.length?'<div class="cards">'+items.map(card).join('')+'</div>'
    :'<div class="empty"><div class="ei">'+(kind==='video'?ICON.video:ICON.pdf)+'</div><b>No '+label.toLowerCase()+' here yet</b>Check back soon.</div>';
  app.innerHTML='<a class="back glass" href="#">&larr; All subjects</a>'+
    '<div class="banner" style="'+cv(s)+'"><span class="wm" aria-hidden="true">'+iconHtml(s)+'</span><span class="ibadge" aria-hidden="true">'+iconHtml(s)+'</span>'+
      '<div><h1>'+s.name+'</h1><div class="counts"><span class="cpill">'+ICON.video+plural(v,'video')+'</span><span class="cpill">'+ICON.pdf+plural(p,'PDF')+'</span></div></div></div>'+
    '<nav class="folders" style="'+cv(s)+'" aria-label="Folders">'+
      '<a class="folder glass" href="#'+s.id+'/videos"'+(kind==='video'?' aria-current="page"':'')+'><span class="fi">'+ICON.folder+'</span><span><b>Videos</b><small>'+plural(v,'file')+'</small></span></a>'+
      '<a class="folder glass" href="#'+s.id+'/pdfs"'+(kind==='pdf'?' aria-current="page"':'')+'><span class="fi">'+ICON.folder+'</span><span><b>PDFs</b><small>'+plural(p,'file')+'</small></span></a>'+
    '</nav>'+
    '<div class="sechead"><h2>'+s.name+' &middot; '+label+'</h2></div>'+
    '<div style="'+cv(s)+'">'+body+'</div>';
}

/* Passcode gate: only active when an API address is set in content.js */
var unlocked=!state.api;
var LS_CODE='studyhub-code',LS_DEV='studyhub-device',lockMsg='',checking=false,memDev=null;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function deviceId(){
  var d=lsGet(LS_DEV)||memDev;
  if(!d){
    d=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('d'+Date.now().toString(36)+Math.random().toString(36).slice(2,12));
    memDev=d;lsSet(LS_DEV,d);
  }
  return d;
}
var REASONS={
  invalid:"That passcode isn't right. Check it and try again.",
  used:'This passcode is already used on another device. Ask the owner to reset it.',
  expired:'This passcode has expired.',
  inactive:'This passcode has been turned off.'
};
function verify(code){
  checking=true;renderLock();
  var url=state.api+(state.api.indexOf('?')>-1?'&':'?')+'code='+encodeURIComponent(code)+'&device='+encodeURIComponent(deviceId());
  fetch(url).then(function(r){return r.json()}).then(function(res){
    checking=false;
    if(res&&res.ok){lsSet(LS_CODE,code);unlocked=true;lockMsg='';render()}
    else{lsDel(LS_CODE);lockMsg=REASONS[res&&res.reason]||REASONS.invalid;renderLock()}
  }).catch(function(){
    checking=false;lockMsg='Could not reach the server. Check your internet and try again.';renderLock();
  });
}
function renderLock(){
  document.title=state.title;
  document.getElementById('brand-name').textContent=state.title;
  if(checking){app.innerHTML='<section class="lock glass"><div class="lockicon">'+ICON.lock+'</div><p>Checking your passcode...</p></section>';return}
  app.innerHTML='<section class="lock glass"><div class="lockicon">'+ICON.lock+'</div><h1>Enter your passcode</h1><p>Each passcode works on one device.</p>'+
    '<form id="lock-form"><input type="text" id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Passcode" aria-label="Passcode" value="'+esc(lsGet(LS_CODE)||'')+'">'+
    '<button class="lockbtn" type="submit">Unlock</button></form><p class="lockerr" role="alert">'+esc(lockMsg)+'</p></section>';
  document.getElementById('lock-form').addEventListener('submit',function(e){
    e.preventDefault();
    var c=document.getElementById('code').value.trim();
    if(!c){lockMsg='Enter your passcode.';renderLock();return}
    verify(c);
  });
}

function render(){
  document.title=state.title;
  document.getElementById('brand-name').textContent=state.title;
  if(!unlocked){renderLock();return}
  var r=parseRoute();
  if(r.sub)renderSubject(r.sub,r.kind);else renderHome();
  window.scrollTo(0,0);
}

function openPlayer(it){
  exitPseudo();
  document.getElementById('player-title').textContent=it.title;
  document.getElementById('player-drive').href=openUrl(it.fid);
  playerFrame.className='frame '+(it.kind==='pdf'?'pdf':'video');
  playerFrame.innerHTML='<iframe src="'+previewUrl(it.fid)+'" allow="autoplay; fullscreen" allowfullscreen title="'+esc(it.title)+'"></iframe>';
  player.showModal();
}
function closePlayer(){if(player.open)player.close()}
player.addEventListener('close',function(){
  if(fsEl()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}}
  exitPseudo();playerFrame.innerHTML='';
});
player.addEventListener('click',function(e){if(e.target===player)closePlayer()});
document.getElementById('player-close').addEventListener('click',closePlayer);

/* Full screen: real fullscreen where the phone allows it, otherwise fill the whole screen */
var fsBtn=document.getElementById('player-fs');
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
function setFsLabel(on){fsBtn.querySelector('span').textContent=on?'Exit full screen':'Full screen';fsBtn.setAttribute('aria-label',on?'Exit full screen':'Full screen')}
function exitPseudo(){player.classList.remove('fs');setFsLabel(!!fsEl())}
function toggleFs(){
  if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
  if(player.classList.contains('fs')){exitPseudo();return}
  var f=playerFrame,req=f.requestFullscreen||f.webkitRequestFullscreen;
  var pseudo=function(){player.classList.add('fs');setFsLabel(true)};
  if(!req){pseudo();return}
  try{
    var p=req.call(f);
    if(p&&p.then){p.then(function(){try{screen.orientation.lock('landscape').catch(function(){})}catch(e){}}).catch(pseudo)}
  }catch(e){pseudo()}
}
fsBtn.addEventListener('click',toggleFs);
function onFsChange(){
  setFsLabel(!!fsEl()||player.classList.contains('fs'));
  if(!fsEl()){try{screen.orientation.unlock()}catch(e){}}
}
document.addEventListener('fullscreenchange',onFsChange);
document.addEventListener('webkitfullscreenchange',onFsChange);

app.addEventListener('click',function(e){
  var t=e.target.closest('[data-open]');
  if(!t)return;
  var it=state.items.filter(function(i){return i.id===t.getAttribute('data-open')})[0];
  if(it)openPlayer(it);
});
app.addEventListener('error',function(e){if(e.target.tagName==='IMG')e.target.remove()},true);
window.addEventListener('hashchange',render);
if(unlocked){render()}
else{var savedCode=lsGet(LS_CODE);if(savedCode)verify(savedCode);else render()}
})();
</script>
</body>
</html>
